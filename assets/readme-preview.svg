<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">AgentForge task board preview</title>
  <desc id="desc">A light macOS-style AgentForge interface with task, heartbeat, and skill tabs plus queue, running, and done columns.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbfbfd"/>
      <stop offset=".55" stop-color="#f5f7fb"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#67d8ff"/>
      <stop offset=".45" stop-color="#2f7bff"/>
      <stop offset="1" stop-color="#5b4bdf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1f2330" flood-opacity=".14"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1f2330" flood-opacity=".08"/>
    </filter>
    <style>
      .ui{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
      .display{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
      .mono{font-family:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace}
      .ink{fill:#1d1d1f}
      .muted{fill:#6e6e73}
      .dim{fill:#9a9aa1}
      .blue{fill:#007aff}
      .green{fill:#34c759}
      .orange{fill:#ff9500}
      .card{fill:#ffffff;stroke:#d9dbe3;stroke-width:1.4}
      .panel{fill:#fbfcff;stroke:#d9dbe3;stroke-width:1.4}
    </style>
  </defs>

  <rect width="1600" height="930" fill="url(#bg)"/>
  <path d="M0 0h1600v930H0z" fill="#fff" opacity=".28"/>

  <g class="ui" filter="url(#shadow)">
    <rect x="80" y="72" width="1440" height="786" rx="8" fill="#ffffff" stroke="#d8dbe5" stroke-width="1.5"/>

    <g>
      <rect x="80" y="72" width="1440" height="116" rx="8" fill="#f8f9fc"/>
      <path d="M80 180h1440" stroke="#d8dbe5" stroke-width="1.5"/>
      <circle cx="112" cy="104" r="10" fill="#ff5f57"/>
      <circle cx="141" cy="104" r="10" fill="#ffbd2e"/>
      <circle cx="170" cy="104" r="10" fill="#28c840"/>
    </g>

    <g transform="translate(112 112)">
      <rect width="58" height="58" rx="14" fill="url(#icon)"/>
      <circle cx="31" cy="30" r="18" fill="#b8ef74"/>
      <circle cx="36" cy="24" r="3" fill="#17321f"/>
      <path d="M20 33c7 7 18 7 25 0" fill="none" stroke="#17321f" stroke-width="3" stroke-linecap="round"/>
      <path d="M43 12l10-8M49 18l13-2" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".84"/>
      <path d="M17 47l-8 7M47 49l8 7" stroke="#184421" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="188" y="138" class="display ink" font-size="30" font-weight="850">AgentForge</text>
    <text x="188" y="164" class="ui dim" font-size="16" font-weight="700">Local-first agent orchestration board</text>

    <g transform="translate(580 116)">
      <rect width="275" height="54" rx="8" fill="#eaf3ff" stroke="#92c4ff" stroke-width="1.4"/>
      <circle cx="26" cy="27" r="7" fill="#007aff"/>
      <text x="46" y="34" class="ui blue" font-size="20" font-weight="850">1 running / 3 queued</text>
    </g>

    <g transform="translate(900 108)">
      <rect width="326" height="68" rx="8" fill="#ffffff" stroke="#d9dbe3" stroke-width="1.4"/>
      <rect x="8" y="8" width="106" height="52" rx="7" fill="#3478f6"/>
      <text x="38" y="42" class="ui" font-size="18" font-weight="850" fill="#fff">Tasks</text>
      <text x="140" y="42" class="ui muted" font-size="18" font-weight="800">Heartbeats</text>
      <text x="258" y="42" class="ui muted" font-size="18" font-weight="800">Skills</text>
    </g>

    <g transform="translate(1252 108)">
      <rect width="162" height="68" rx="8" fill="#ffffff" stroke="#d9dbe3" stroke-width="1.4"/>
      <text x="44" y="42" class="ui dim" font-size="17" font-weight="650">Search</text>
    </g>
    <g transform="translate(1430 108)">
      <rect width="66" height="68" rx="8" fill="#3478f6"/>
      <text x="17" y="42" class="ui" font-size="19" font-weight="900" fill="#fff">New</text>
    </g>

    <g transform="translate(112 220)">
      <g filter="url(#softShadow)">
        <rect width="214" height="88" rx="8" class="card"/>
        <text x="22" y="32" class="ui muted" font-size="17" font-weight="800">Total</text>
        <text x="22" y="70" class="display ink" font-size="34" font-weight="900">6</text>
      </g>
      <g transform="translate(238 0)" filter="url(#softShadow)">
        <rect width="214" height="88" rx="8" class="card"/>
        <text x="22" y="32" class="ui muted" font-size="17" font-weight="800">Queue</text>
        <text x="22" y="70" class="display orange" font-size="34" font-weight="900">3</text>
      </g>
      <g transform="translate(476 0)" filter="url(#softShadow)">
        <rect width="214" height="88" rx="8" class="card"/>
        <text x="22" y="32" class="ui muted" font-size="17" font-weight="800">Running</text>
        <text x="22" y="70" class="display blue" font-size="34" font-weight="900">1</text>
      </g>
      <g transform="translate(714 0)" filter="url(#softShadow)">
        <rect width="214" height="88" rx="8" class="card"/>
        <text x="22" y="32" class="ui muted" font-size="17" font-weight="800">Done</text>
        <text x="22" y="70" class="display green" font-size="34" font-weight="900">2</text>
      </g>
    </g>

    <g transform="translate(112 360)">
      <g filter="url(#softShadow)">
        <rect width="432" height="420" rx="8" class="panel"/>
        <rect x="26" y="28" width="46" height="46" rx="8" fill="#fff7e8" stroke="#eadcc5"/>
        <path d="M38 43h22M42 51h14M46 59h6" stroke="#ff9500" stroke-width="3" stroke-linecap="round"/>
        <text x="92" y="60" class="display ink" font-size="25" font-weight="850">Queue</text>
        <text x="340" y="60" class="mono muted" font-size="18" font-weight="800">3</text>
        <path d="M26 88h380" stroke="#d9dbe3"/>
        <g transform="translate(26 112)">
          <rect width="380" height="122" rx="8" fill="#fff" stroke="#d9dbe3"/>
          <text x="20" y="34" class="ui ink" font-size="18" font-weight="850">Review scheduler drift</text>
          <text x="20" y="64" class="ui muted" font-size="14">Check delayed and cron tasks after app sleep.</text>
          <rect x="20" y="86" width="86" height="24" rx="6" fill="#fff3df"/>
          <text x="34" y="103" class="mono orange" font-size="12" font-weight="800">scheduled</text>
          <rect x="116" y="86" width="58" height="24" rx="6" fill="#eaf3ff"/>
          <text x="130" y="103" class="mono blue" font-size="12" font-weight="800">codex</text>
        </g>
        <g transform="translate(26 252)">
          <rect width="380" height="112" rx="8" fill="#fff" stroke="#d9dbe3"/>
          <text x="20" y="34" class="ui ink" font-size="18" font-weight="850">Draft channel smoke test</text>
          <text x="20" y="64" class="ui muted" font-size="14">Create a compact startup checklist.</text>
          <rect x="20" y="80" width="58" height="24" rx="6" fill="#eaf3ff"/>
          <text x="33" y="97" class="mono blue" font-size="12" font-weight="800">qa</text>
        </g>
      </g>

      <g transform="translate(472 0)" filter="url(#softShadow)">
        <rect width="432" height="420" rx="8" class="panel"/>
        <rect x="26" y="28" width="46" height="46" rx="8" fill="#eaf3ff" stroke="#c9dff8"/>
        <path d="M44 42v18l15-9z" fill="#007aff"/>
        <text x="92" y="60" class="display ink" font-size="25" font-weight="850">Running</text>
        <text x="340" y="60" class="mono muted" font-size="18" font-weight="800">1</text>
        <path d="M26 88h380" stroke="#d9dbe3"/>
        <g transform="translate(26 112)">
          <rect width="380" height="132" rx="8" fill="#fff" stroke="#d9dbe3"/>
          <text x="20" y="34" class="ui ink" font-size="18" font-weight="850">Refine trace output</text>
          <text x="20" y="64" class="ui muted" font-size="14">Group stream-json events into checkpoints.</text>
          <rect x="20" y="90" width="72" height="24" rx="6" fill="#eaf3ff"/>
          <text x="34" y="107" class="mono blue" font-size="12" font-weight="800">trace</text>
          <rect x="104" y="90" width="82" height="24" rx="6" fill="#eef0ff"/>
          <text x="118" y="107" class="mono" font-size="12" font-weight="800" fill="#5856d6">renderer</text>
        </g>
      </g>

      <g transform="translate(944 0)" filter="url(#softShadow)">
        <rect width="432" height="420" rx="8" class="panel"/>
        <rect x="26" y="28" width="46" height="46" rx="8" fill="#ecfff2" stroke="#ccebd5"/>
        <path d="M38 52l8 8 16-20" fill="none" stroke="#34c759" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="92" y="60" class="display ink" font-size="25" font-weight="850">Done</text>
        <text x="340" y="60" class="mono muted" font-size="18" font-weight="800">2</text>
        <path d="M26 88h380" stroke="#d9dbe3"/>
        <g transform="translate(26 112)">
          <rect width="380" height="122" rx="8" fill="#fff" stroke="#d9dbe3"/>
          <text x="20" y="34" class="ui ink" font-size="18" font-weight="850">Ship skill sweep summary</text>
          <text x="20" y="64" class="ui muted" font-size="14">Summarize promoted patterns and skills.</text>
          <rect x="20" y="86" width="88" height="24" rx="6" fill="#ecfff2"/>
          <text x="34" y="103" class="mono green" font-size="12" font-weight="800">completed</text>
          <rect x="118" y="86" width="68" height="24" rx="6" fill="#eaf3ff"/>
          <text x="132" y="103" class="mono blue" font-size="12" font-weight="800">skills</text>
        </g>
      </g>
    </g>
  </g>
</svg>
